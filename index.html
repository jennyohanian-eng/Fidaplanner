<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIDA ✨ Wedding Planner</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#FFF6EC;color:#3a2a20}
header{background:#D9A679;color:white;text-align:center;padding:22px 10px;font-size:24px;font-weight:bold;letter-spacing:2px}
.top{max-width:900px;margin:15px auto;padding:0 12px;display:flex;gap:8px}
.top input,.top select{flex:1;padding:12px;border-radius:12px;border:1px solid #e8d5c0;background:white}
.top button{padding:12px 16px;border-radius:12px;border:0;background:#D9A679;color:white;font-weight:bold}
.card{max-width:900px;margin:10px auto;background:white;border-radius:18px;padding:18px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.card h2{margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 input,.grid2 select,.full input{width:100%;padding:13px;border-radius:12px;border:1px solid #eee;background:#FFFaf5;font-size:15px}
.full{margin-top:10px}
.add{margin-top:14px;width:100%;padding:14px;border:0;border-radius:12px;background:#E8A87C;color:white;font-weight:bold;font-size:16px}
.note{font-size:13px;color:#888;margin-top:10px;line-height:1.5}
.couples{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:900px;margin:15px auto;padding:0 12px}
.couple{background:white;border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.06);position:relative}
.couple h3{margin:0 0 6px;font-size:18px}
.couple p{margin:4px 0;font-size:14px;color:#666}
.badge{display:inline-block;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:bold;margin-top:8px}
.badge.confirmed{background:#D9F2D9;color:#2a6b2a}
.badge.pending{background:#FFF0C9;color:#8a6a00}
.del{position:absolute;top:10px;right:10px;border:0;background:#ffeeee;border-radius:50%;width:28px;height:28px;cursor:pointer}
@media(max-width:600px){.couples{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>FIDA ✨ Wedding Planner</header>

<div class="top">
<input id="search" placeholder="Search couple... ex: Dena" oninput="render()">
<select id="filter" onchange="render()"><option value="All">All Status</option><option>Confirmed</option><option>Pending</option></select>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})">🏠 Home</button>
</div>

<div class="card">
<h2>➕ Add New Couple</h2>
<div class="grid2">
<input id="bride" placeholder="Bride name - ex: Dena">
<input id="groom" placeholder="Groom name - ex: Omar">
<input id="date" type="date" value="2026-11-19">
<input id="church" placeholder="Church - ex: St. Charbel">
</div>
<div class="full"><input id="guests" type="number" placeholder="Number of guests - ex: 150"></div>
<div class="grid2" style="margin-top:10px">
<select id="status"><option>Confirmed</option><option>Pending</option></select>
<input id="phone" placeholder="Phone - ex: 03 123456">
</div>
<button class="add" onclick="addCouple()">Add Couple + Save</button>
<div class="note">Fida, ba3ed ma tkebse Add, l couple byenzal ta7et bel list, w byedall ma7fouz 3andik 7atta iza sakkarte l safha.</div>
</div>

<div id="list" class="couples"></div>

<script>
let couples = JSON.parse(localStorage.getItem('fida_couples') || 'null');
if(!couples){
couples=[
{bride:'Dena',groom:'Omar',date:'2026-11-19',church:'St. Charbel - Kasrouane',guests:'150',status:'Confirmed',phone:'03 123456'},
{bride:'Mira',groom:'Elie',date:'2026-12-05',church:'Notre Dame - Harissa',guests:'200',status:'Pending',phone:'71 654321'},
{bride:'Sara',groom:'Karim',date:'2027-01-16',church:'St. Maroun - Beirut',guests:'120',status:'Confirmed',phone:'03 987654'}
];
localStorage.setItem('fida_couples',JSON.stringify(couples));
}
function save(){localStorage.setItem('fida_couples',JSON.stringify(couples))}
function addCouple(){
let b=document.getElementById('bride').value.trim();
let g=document.getElementById('groom').value.trim();
if(!b||!g){alert('Fida, 3abbe esm l 3arous w l 3aris la2a!');return;}
couples.unshift({bride:b,groom:g,date:document.getElementById('date').value,church:document.getElementById('church').value,guests:document.getElementById('guests').value,status:document.getElementById('status').value,phone:document.getElementById('phone').value});
save();render();
['bride','groom','church','guests','phone'].forEach(id=>document.getElementById(id).value='');
}
function del(i){if(confirm('Baddik tem7e hayda l couple?')){couples.splice(i,1);save();render();}}
function render(){
let q=document.getElementById('search').value.toLowerCase();
let f=document.getElementById('filter').value;
let html='';
couples.forEach((c,i)=>{
if(q && !(c.bride+' '+c.groom).toLowerCase().includes(q)) return;
if(f!=='All' && c.status!==f) return;
html+=`<div class="couple"><button class="del" onclick="del(${i})">✕</button><h3>💍 ${c.bride} & ${c.groom}</h3><p>📅 ${c.date || '-'}</p><p>⛪ ${c.church || '-'}</p><p>👥 Guests: ${c.guests || '-'}</p><p>📞 ${c.phone || '-'}</p><span class="badge ${c.status==='Confirmed'?'confirmed':'pending'}">${c.status}</span></div>`;
});
document.getElementById('list').innerHTML=html || '<p style="text-align:center;color:#999">Ma fi couples ba3ed. Zide awal couple men fo2.</p>';
}
render();
</script>
</body>
</html>
